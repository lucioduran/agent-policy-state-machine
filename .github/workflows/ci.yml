name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.0'
      - run: python -m pip install uv==0.8.23
      - run: uv sync --frozen
      - run: uv run ruff check src scripts tests
      - run: uv run ruff format --check src scripts tests
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: uv run python scripts/replay.py
      - run: uv build
      - name: Installed wheel smoke test
        run: |
          python -m venv work/smoke
          work/smoke/bin/pip install --no-deps dist/*.whl
          work/smoke/bin/python -I -c 'from agent_policy import Policy; assert Policy(object()).snapshot().balance == 0'
          work/smoke/bin/agent-policy plan authorize execute fail compensate
