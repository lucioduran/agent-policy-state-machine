[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent-policy-state-machine"
version = "0.1.0"
description = "An executable authorization policy with bounded TLA+ evidence"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Lucho Duran", email = "email@lucioduran.com"}]

[project.scripts]
agent-policy = "agent_policy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_policy"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.4", "mypy==1.18.2", "build==1.3.0"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
